<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zealmart | Authentic Tech & Home Appliances</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://korablobstorage.blob.core.windows.net/modal/korapay.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zeal: {
                            blue: '#0a2357',   /* Deep Navy */
                            red: '#e61601',    /* Vibrant SIMS/CNC Red */
                            dark: '#111827',
                            light: '#f9fafb',
                            gray: '#f3f4f6',
                            border: '#e5e7eb'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['DM Sans', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 0 0 1px rgba(0,0,0,.05), 0 2px 5px rgba(0,0,0,.05)',
                        'card-hover': '0 0 0 1px rgba(0,0,0,.1), 0 4px 12px rgba(0,0,0,.1)',
                    },
                    animation: {
                        marquee: 'marquee 55s linear infinite',
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                        'fade-in-down': 'fadeInDown 0.8s ease-out forwards',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(100%)' },
                            '100%': { transform: 'translateX(-100%)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeInDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap');

        body {
            background-color: #f4f5f8;
            color: #333;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .product-card-container {
            background: #fff;
            border: 1px solid #eee;
            transition: all 0.2s ease;
        }
        .product-card-container:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-color: #ddd;
        }
        
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
  </head>
  <body class="font-sans flex flex-col min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
